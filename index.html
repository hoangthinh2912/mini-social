<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Social</title>
<style>
  :root{
    --bg:#ffffff; --bg-alt:#f7f7f8; --text:#1a1a1a; --text-muted:#6b6b70;
    --border:#e5e5e8; --accent:#2b2b2e; --accent-soft:#eeeeef;
    --danger:#dc2626; --like:#dc2626;
  }
  html[data-theme="dark"]{
    --bg:#15151a; --bg-alt:#1d1d23; --text:#eaeaee; --text-muted:#9a9aa2;
    --border:#2c2c34; --accent:#eaeaee; --accent-soft:#2a2a32;
  }
  html[data-theme="dark"] .btn-primary{color:#15151a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); background:var(--bg); line-height:1.5; min-height:100vh;
  }
  .hidden{display:none !important}

  /* Auth screen */
  .auth-wrap{max-width:360px; margin:0 auto; padding:80px 20px; text-align:center}
  .auth-wrap h1{font-size:24px; font-weight:800; margin-bottom:6px}
  .auth-wrap .sub{color:var(--text-muted); font-size:13.5px; margin-bottom:28px}
  .field{margin-bottom:12px; text-align:left}
  .field input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-alt); color:var(--text); font-size:14px; font-family:inherit; outline:none;
  }
  .field input:focus{border-color:var(--text)}
  .btn{padding:12px; width:100%; border-radius:10px; border:none; cursor:pointer; font-size:14.5px; font-weight:700; font-family:inherit}
  .btn-primary{background:var(--accent); color:#fff}
  .switch-link{margin-top:16px; font-size:13px; color:var(--text-muted)}
  .switch-link a{color:var(--text); font-weight:700; text-decoration:none; cursor:pointer}
  .auth-error{color:var(--danger); font-size:13px; margin-bottom:12px; min-height:16px}

  /* Feed screen */
  .top{
    position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:14px 20px; z-index:10;
  }
  .top h1{font-size:18px; font-weight:800}
  .top-actions{display:flex; align-items:center; gap:8px}
  .theme-toggle, .logout-btn{
    border:1px solid var(--border); background:var(--bg-alt); color:var(--text);
    border-radius:9px; cursor:pointer; font-size:13px; padding:8px 12px;
  }
  .theme-toggle{width:36px; padding:0; height:36px}

  .feed-wrap{max-width:560px; margin:0 auto; padding:20px 16px 80px}

  .composer{border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:20px; background:var(--bg-alt)}
  .composer textarea{
    width:100%; border:none; background:none; color:var(--text); font-size:14.5px;
    font-family:inherit; resize:none; outline:none; min-height:50px;
  }
  .composer-foot{display:flex; justify-content:flex-end; margin-top:8px}
  .composer-foot .btn{width:auto; padding:9px 20px}

  .post{border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px}
  .post-head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .avatar{
    width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#3a3a3d,#1a1a1a);
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
  }
  .post-head .name{font-weight:700; font-size:14px}
  .post-head .time{font-size:12px; color:var(--text-muted)}
  .post-content{font-size:14.5px; margin-bottom:12px; white-space:pre-wrap; word-break:break-word}
  .post-actions{display:flex; gap:16px}
  .action-btn{
    background:none; border:none; cursor:pointer; font-size:13px; color:var(--text-muted);
    display:flex; align-items:center; gap:5px; font-family:inherit;
  }
  .action-btn.liked{color:var(--like); font-weight:700}

  .comments{margin-top:12px; padding-top:12px; border-top:1px solid var(--border)}
  .comment{display:flex; gap:8px; margin-bottom:10px; font-size:13px}
  .comment .avatar{width:26px; height:26px; font-size:11px}
  .comment .bubble{background:var(--bg-alt); border-radius:12px; padding:8px 12px; flex:1}
  .comment .cname{font-weight:700; margin-right:6px}
  .comment-form{display:flex; gap:8px; margin-top:8px}
  .comment-form input{
    flex:1; padding:9px 12px; border-radius:999px; border:1px solid var(--border);
    background:var(--bg-alt); color:var(--text); font-size:13px; font-family:inherit; outline:none;
  }
  .comment-form button{
    border:none; background:var(--accent); color:#fff; border-radius:999px; padding:9px 16px;
    font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  html[data-theme="dark"] .comment-form button{color:#15151a}

  .empty{text-align:center; color:var(--text-muted); padding:60px 0; font-size:14px}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen" class="auth-wrap">
  <h1>👥 Mini Social</h1>
  <div class="sub" id="auth-sub">Đăng nhập để xem bảng tin</div>
  <div class="auth-error" id="auth-error"></div>
  <div class="field"><input id="a-username" type="text" placeholder="Tên đăng nhập"></div>
  <div class="field"><input id="a-password" type="password" placeholder="Mật khẩu"></div>
  <button class="btn btn-primary" id="auth-submit">Đăng nhập</button>
  <div class="switch-link" id="switch-link">Chưa có tài khoản? <a id="switch-btn">Đăng ký ngay</a></div>
</div>

<!-- FEED SCREEN -->
<div id="feed-screen" class="hidden">
  <div class="top">
    <h1>👥 Mini Social</h1>
    <div class="top-actions">
      <button class="theme-toggle" id="theme-toggle">🌙</button>
      <button class="logout-btn" id="logout-btn">Đăng xuất</button>
    </div>
  </div>
  <div class="feed-wrap">
    <div class="composer">
      <textarea id="post-input" placeholder="Bạn đang nghĩ gì?" maxlength="500"></textarea>
      <div class="composer-foot"><button class="btn btn-primary" id="post-btn">Đăng</button></div>
    </div>
    <div id="posts"></div>
    <div class="empty hidden" id="feed-empty">Chưa có bài đăng nào. Hãy là người đầu tiên!</div>
  </div>
</div>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      root.setAttribute('data-theme', 'dark');
      if (themeToggle) themeToggle.textContent = '☀️';
    }
  }
  applyTheme();
  themeToggle.addEventListener('click', () => {
    const isDark = root.getAttribute('data-theme') === 'dark';
    if (isDark) { root.removeAttribute('data-theme'); localStorage.setItem('theme','light'); themeToggle.textContent='🌙'; }
    else { root.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); themeToggle.textContent='☀️'; }
  });

  const API = '/api/social';
  let token = localStorage.getItem('social_token');
  let currentUser = JSON.parse(localStorage.getItem('social_user') || 'null');
  let mode = 'login'; // or 'register'

  const authScreen = document.getElementById('auth-screen');
  const feedScreen = document.getElementById('feed-screen');
  const authError = document.getElementById('auth-error');
  const authSub = document.getElementById('auth-sub');
  const switchLink = document.getElementById('switch-link');
  const authSubmit = document.getElementById('auth-submit');

  function showFeed() {
    authScreen.classList.add('hidden');
    feedScreen.classList.remove('hidden');
    loadPosts();
  }
  function showAuth() {
    feedScreen.classList.add('hidden');
    authScreen.classList.remove('hidden');
  }

  function forceLogout(message) {
    localStorage.removeItem('social_token');
    localStorage.removeItem('social_user');
    token = null; currentUser = null;
    showAuth();
    if (message) authError.textContent = message;
  }

  // Kiểm tra 401 (phiên đăng nhập hết hạn/không hợp lệ) sau mỗi lần gọi API cần đăng nhập
  function checkAuthFailure(res) {
    if (res.status === 401) {
      forceLogout('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.');
      return true;
    }
    return false;
  }

  function toggleAuthMode() {
    mode = mode === 'login' ? 'register' : 'login';
    authError.textContent = '';
    if (mode === 'register') {
      authSub.textContent = 'Tạo tài khoản mới';
      authSubmit.textContent = 'Đăng ký';
      switchLink.innerHTML = 'Đã có tài khoản? <a id="switch-btn">Đăng nhập</a>';
    } else {
      authSub.textContent = 'Đăng nhập để xem bảng tin';
      authSubmit.textContent = 'Đăng nhập';
      switchLink.innerHTML = 'Chưa có tài khoản? <a id="switch-btn">Đăng ký ngay</a>';
    }
    document.getElementById('switch-btn').addEventListener('click', toggleAuthMode);
  }
  document.getElementById('switch-btn').addEventListener('click', toggleAuthMode);

  authSubmit.addEventListener('click', async () => {
    const username = document.getElementById('a-username').value.trim();
    const password = document.getElementById('a-password').value;
    authError.textContent = '';
    if (!username || !password) { authError.textContent = 'Vui lòng nhập đầy đủ'; return; }

    const endpoint = mode === 'login' ? '/login' : '/register';
    const res = await fetch(API + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { authError.textContent = data.error || 'Có lỗi xảy ra'; return; }

    token = data.token;
    currentUser = data.user;
    localStorage.setItem('social_token', token);
    localStorage.setItem('social_user', JSON.stringify(currentUser));
    showFeed();
  });

  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('social_token');
    localStorage.removeItem('social_user');
    token = null; currentUser = null;
    showAuth();
  });

  function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'vừa xong';
    if (diff < 3600) return Math.floor(diff/60) + ' phút trước';
    if (diff < 86400) return Math.floor(diff/3600) + ' giờ trước';
    return Math.floor(diff/86400) + ' ngày trước';
  }
  function initials(name) { return name.slice(0,2).toUpperCase(); }
  function authHeaders() { return token ? { 'Authorization': 'Bearer ' + token } : {}; }

  const postsEl = document.getElementById('posts');
  const feedEmpty = document.getElementById('feed-empty');

  async function loadPosts() {
    const res = await fetch(API + '/posts', { headers: authHeaders() });
    const posts = await res.json();
    postsEl.innerHTML = '';
    feedEmpty.classList.toggle('hidden', posts.length > 0);
    posts.forEach(renderPost);
  }

  function renderPost(p) {
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
      <div class="post-head">
        <div class="avatar">${initials(p.username)}</div>
        <div>
          <div class="name"></div>
          <div class="time">${timeAgo(p.created_at)}</div>
        </div>
      </div>
      <div class="post-content"></div>
      <div class="post-actions">
        <button class="action-btn like-btn ${p.liked_by_me ? 'liked' : ''}">❤️ <span class="like-count">${p.like_count}</span></button>
        <button class="action-btn comment-toggle">💬 <span class="comment-count">${p.comment_count}</span></button>
      </div>
      <div class="comments hidden"></div>
    `;
    div.querySelector('.name').textContent = p.username;
    div.querySelector('.post-content').textContent = p.content;

    div.querySelector('.like-btn').addEventListener('click', () => toggleLike(p.id, div));
    div.querySelector('.comment-toggle').addEventListener('click', () => toggleComments(p.id, div));

    postsEl.appendChild(div);
  }

  async function toggleLike(postId, div) {
    if (!token) return;
    const res = await fetch(`${API}/posts/${postId}/like`, { method: 'POST', headers: authHeaders() });
    if (checkAuthFailure(res)) return;
    const data = await res.json();
    const btn = div.querySelector('.like-btn');
    btn.classList.toggle('liked', data.liked);
    btn.querySelector('.like-count').textContent = data.like_count;
  }

  async function toggleComments(postId, div) {
    const box = div.querySelector('.comments');
    if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
    box.classList.remove('hidden');
    await renderComments(postId, box);
  }

  async function renderComments(postId, box) {
    const res = await fetch(`${API}/posts/${postId}/comments`);
    const comments = await res.json();
    box.innerHTML = '';
    comments.forEach(c => {
      const row = document.createElement('div');
      row.className = 'comment';
      row.innerHTML = `
        <div class="avatar">${initials(c.username)}</div>
        <div class="bubble"><span class="cname"></span><span class="ctext"></span></div>
      `;
      row.querySelector('.cname').textContent = c.username;
      row.querySelector('.ctext').textContent = c.content;
      box.appendChild(row);
    });

    const form = document.createElement('div');
    form.className = 'comment-form';
    form.innerHTML = `<input type="text" placeholder="Viết bình luận..."><button>Gửi</button>`;
    const input = form.querySelector('input');
    const submit = async () => {
      const content = input.value.trim();
      if (!content || !token) return;
      const res = await fetch(`${API}/posts/${postId}/comments`, {
        method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });
      if (checkAuthFailure(res)) return;
      if (res.ok) {
        input.value = '';
        await renderComments(postId, box);
        await loadPosts();
      }
    };
    form.querySelector('button').addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    box.appendChild(form);
  }

  document.getElementById('post-btn').addEventListener('click', async () => {
    const input = document.getElementById('post-input');
    const content = input.value.trim();
    if (!content || !token) return;
    const res = await fetch(API + '/posts', {
      method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    if (checkAuthFailure(res)) return;
    if (res.ok) { input.value = ''; await loadPosts(); }
  });

  if (token && currentUser) showFeed(); else showAuth();
</script>

</body>
</html>
